schema_version: "1.1"
name: flags-null-deref-and-swallowed-exception
expected_outcome: |
  The review reports two findings: (1) getShippingLabel dereferences the result of
  orderRepo.findById without a null check (src/orders/orderService.ts:16), so an unknown
  id throws a TypeError; (2) cancelOrder swallows a refund failure with a debug log
  (src/orders/orderService.ts:23-24) and still marks the order CANCELLED, so the customer
  is not refunded and nobody is alerted. Every finding has a concrete scenario.
context:
  scaffold_script: place-files.sh
